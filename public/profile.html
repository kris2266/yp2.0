            <div class="floating-flower" style="left:85%;animation-duration:15s;animation-delay:2s"></div>
        </div>
        <div class="logo">HANDY</div>
        <a href="/login.html" class="login" style="visibility:hidden">
            <span class="user-icon"></span>
            <span class="login-text">ВОЙТИ</span>
        </a>
        <div class="flower flower-left"></div>
        <div class="flower flower-right"></div>

    <nav class="nav-menu">
        <a href="index.html" class="menu-btn active" data-text="главная">главная</a>

    <section class="account-section">

                    <div class="floating-flower" style="left:10%;animation-duration:13s;animation-delay:0s"></div>
                    <div class="floating-flower" style="left:60%;animation-duration:17s;animation-delay:2s"></div>
                    <div class="floating-flower" style="left:90%;animation-duration:15s;animation-delay:4s"></div>
                </div>
                <a href="/cabinet" class="profile-avatar-wrap" title="личный кабинет">
                    <div class="avatar-aura"></div>
                    <div class="profile-avatar">
                        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
                    </div>
                </a>
                <div class="profile-info"><span class="profile-name">имя</span></div>
                <a href="tel:+77777777777" class="profile-phone">+7 777 777 77 77</a>
                <a href="/api/logout" class="logout-btn" style="display:block;text-align:center;text-decoration:none">выйти</a>
                <div class="card-spin-flower card-spin-flower-tr"></div>
                <div class="card-spin-flower card-spin-flower-bl"></div>
            </aside>

            <div class="account-content">
                <div class="bookings-block">
                    <div class="bg-animation">
                        <div class="floating-flower" style="left:10%;animation-duration:12s;animation-delay:0s"></div>
                        <div class="floating-flower" style="left:50%;animation-duration:16s;animation-delay:3s"></div>
                        <div class="floating-flower" style="left:85%;animation-duration:14s;animation-delay:1s"></div>
                    </div>
                    <div class="master-name1">
                        <img src="photos/gif4.gif" alt="" class="name-gif">
                        <h3 class="block-title">ближайшие записи</h3>
                        <img src="photos/gif4.gif" alt="" class="name-gif">
                    </div>
                    <div class="bookings-list" id="activeBookings"></div>
                    <div class="card-spin-flower card-spin-flower-tr"></div>
                    <div class="card-spin-flower card-spin-flower-bl"></div>
                </div>
                <div class="bookings-block">
                    <div class="bg-animation">
                        <div class="floating-flower" style="left:15%;animation-duration:13s;animation-delay:0s"></div>
                        <div class="floating-flower" style="left:55%;animation-duration:17s;animation-delay:2s"></div>
                        <div class="floating-flower" style="left:88%;animation-duration:15s;animation-delay:4s"></div>
                    </div>
                    <div class="master-name1">
                        <img src="photos/gif2.jpg" alt="" class="name-gif">
                        <h3 class="block-title">история</h3>
                        <img src="photos/gif2.jpg" alt="" class="name-gif">
                    </div>
                    <div class="bookings-list" id="doneBookings"></div>
                    <div class="card-spin-flower card-spin-flower-tr"></div>
                    <div class="card-spin-flower card-spin-flower-bl"></div>
                </div>
            </div>
        </div>
    </section>
    <footer class="footer">
        <div class="bg-animation">
            <div class="floating-flower" style="left:8%;animation-duration:13s;animation-delay:0s"></div>
            <div class="floating-flower" style="left:30%;animation-duration:17s;animation-delay:2s"></div>
            <div class="floating-flower" style="left:52%;animation-duration:15s;animation-delay:4s"></div>
            <div class="floating-flower" style="left:74%;animation-duration:19s;animation-delay:1s"></div>
            <div class="floating-flower" style="left:92%;animation-duration:16s;animation-delay:3s"></div>
        </div>
        <div class="footer-logo">HANDY</div>
        <div class="footer-content">
            <div class="footer-contacts">
                <a class="footer-line">+7 777 777 77 77</a>
                <a class="footer-line">pochta@mail.ru</a>
                <p class="footer-line footer-gap">Адреса главных офисов:</p>
                <p class="footer-line">г.Москва, ул.Московская 67</p>
                <p class="footer-line">г.Москва, ул.Арбатская 52</p>
                <p class="footer-line footer-gap">Соц. сети:</p>
                <div class="footer-social">
                    <a href="#" class="social-btn" aria-label="ВКонтакте">
                        <svg viewBox="0 0 24 24"><path d="M13.1 16.2c-5.9 0-9.8-4.2-9.9-11.2h3.1c.1 5.1 2.4 7.3 4.1 7.7V5h2.9v6.6c1.8-.2 3.5-2.3 4.2-4.5h2.9c-.5 2.5-2.3 4.5-3.7 5.3 1.4.6 3.4 2.4 4.1 5.3h-3.2c-.7-2.2-2.4-3.9-4.3-4.1v4.1h-.2z"/></svg>
                    </a>
                    <a href="#" class="social-btn" aria-label="Telegram">
                        <svg viewBox="0 0 24 24"><path d="M21.5 4.3 2.9 11.6c-1 .4-1 1.3-.2 1.6l4.7 1.5 1.8 5.6c.2.6.4.8 1 .8.5 0 .7-.2 1-.5l2.4-2.3 4.8 3.6c.9.5 1.5.2 1.7-.8l3.1-14.7c.3-1.3-.5-1.9-1.5-1.4z"/></svg>
                    </a>
                    <a href="#" class="social-btn" aria-label="Instagram">
                        <svg viewBox="0 0 24 24">
                            <rect x="3" y="3" width="18" height="18" rx="5" fill="none" stroke="currentColor" stroke-width="2"/>
                            <circle cx="12" cy="12" r="4.5" fill="none" stroke="currentColor" stroke-width="2"/>
                            <circle cx="17.5" cy="6.5" r="1.5"/>
                        </svg>
                    </a>
                </div>
            </div>
        </div>
    </footer>
    <script>
    (async function () {
        const meRes = await fetch('/api/me');
        if (!meRes.ok) { window.location.href = '/login.html'; return; }
        const me = await meRes.json();
        document.querySelector('.profile-name').textContent = me.name;
        const phoneEl = document.querySelector('.profile-phone');
        phoneEl.textContent = me.phone;
        phoneEl.href = 'tel:' + me.phone.replace(/\s/g, '');

        const bRes = await fetch('/api/bookings');
        const { active, done } = await bRes.json();

        const activeBox = document.getElementById('activeBookings');
        const doneBox = document.getElementById('doneBookings');

        function renderCard(b, isHistory = false) {
            const img = b.image ? `<img src="${b.image}" alt="">` : 'фото';
            const timeStr = b.booking_time ? ' · ' + b.booking_time : '';
            const doneBtn = !isHistory
                ? `<button class="done-btn" onclick="event.stopPropagation(); markDone(${b.id})">услуга оказана</button>`
                : '';
            return `
                <div class="booking-item"
                     data-service="${b.service}"
                     data-master="${b.master}"
                     data-address="${b.address}"
                     data-date="${b.booking_date}"
                     data-time="${b.booking_time || ''}"
                     data-name="${b.client_name}"
                     data-phone="${b.client_phone}"
                     data-price="${b.price}"
                     data-image="${b.image || ''}">
                    <div class="booking-photo">${img}</div>
                    <div class="booking-info">
                        <p class="booking-name">${b.service}</p>
                        <p class="booking-master">${b.master}</p>
                        <p class="booking-date">${b.booking_date}${timeStr}</p>
                        ${doneBtn}
                    </div>
                    <div class="booking-price">${b.price}₽</div>
                </div>`;
        }

        activeBox.innerHTML = active.length
            ? active.map(b => renderCard(b, false)).join('')
            : '<p class="empty-msg">пока нет активных записей</p>';

        doneBox.innerHTML = done.length
            ? done.map(b => renderCard(b, true)).join('')
            : '<p class="empty-msg">история пуста</p>';

        document.querySelectorAll('.booking-item').forEach(card => {
            card.style.cursor = 'pointer';
            card.addEventListener('click', () => {
                const d = card.dataset;
                document.getElementById('bookingDetails').innerHTML = `
                    <h3 class="modal-title">${d.service}</h3>
                    <div class="details-row"><span>мастер:</span> ${d.master}</div>
                    <div class="details-row"><span>дата:</span> ${d.date}</div>
                    <div class="details-row"><span>время:</span> ${d.time || '—'}</div>
                    <div class="details-row"><span>адрес:</span> ${d.address}</div>
                    <div class="details-row"><span>имя:</span> ${d.name}</div>
                    <div class="details-row"><span>телефон:</span> ${d.phone}</div>
                    <div class="details-row"><span>стоимость:</span> ${d.price}₽</div>
                    ${d.image ? `<div class="details-img"><img src="${d.image}"></div>` : ''}
                `;
                document.getElementById('bookingModal').classList.add('active');
            });
        });

        window.markDone = async function(id) {
            if (!confirm('Подтвердите, что услуга была оказана. Запись переместится в историю.')) return;
            const res = await fetch(`/api/bookings/${id}/done`, { method: 'POST' });
            if (res.ok) {
                window.location.reload();
            } else {
                const err = await res.json().catch(()=>({}));
                alert(err.error || 'Не удалось обновить запись');
            }
        };
    })();
    </script>

    <script src="js/widjet.js"></script>

    <div class="modal-overlay" id="bookingModal">
        <div class="modal-content">
            <button class="modal-close" onclick="document.getElementById('bookingModal').classList.remove('active')">&times;</button>
            <div id="bookingDetails"></div>
        </div>
    </div>
</body>
</html>
